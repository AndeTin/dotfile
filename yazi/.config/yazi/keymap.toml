[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on   = [ "g", "a" ]
run  = "cd /mnt/NVME1/"
desc = "Go to second drive"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents/"
desc = "Go to Document"

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = "cd ~/.local/"
desc = "Go to .local"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Pictures/"
desc = "Go to Pictures"
