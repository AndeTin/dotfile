# Keep your existing previewers below
[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"

[opener]
evince = [
  { run = "evince %s", orphan = true, desc = "Open with evince" }
]
onlyoffice = [
  { run = "flatpak run org.onlyoffice.desktopeditors %s", orphan = true, desc = "Open with onlyoffice" }
]

[open]
prepend_rules = [
  { url = "*.pdf", use = ["evince", "onlyoffice"] },
  { mime = "application/pdf", use = ["evince", "onlyoffice"] }
]
